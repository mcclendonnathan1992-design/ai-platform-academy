apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: ai-developer
  namespace: ai-lab
rules:
  - apiGroups: [""]
    resources: [pods, pods/log, services, configmaps]
    verbs: [get, list, watch]
  - apiGroups: ["apps"]
    resources: [deployments]
    verbs: [get, list, watch, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ai-developer
  namespace: ai-lab
subjects:
  - kind: Group
    name: ai-developers
    apiGroup: rbac.authorization.k8s.io
roleRef:
  kind: Role
  name: ai-developer
  apiGroup: rbac.authorization.k8s.io
