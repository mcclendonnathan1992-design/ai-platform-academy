# Pulls the model into the shared volume once. Gateway /readyz stays 503 until it finishes.
apiVersion: batch/v1
kind: Job
metadata:
  name: ollama-model-pull
spec:
  backoffLimit: 4
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels: {app: model-pull}
    spec:
      restartPolicy: OnFailure
      initContainers:
        - name: wait-for-ollama
          image: busybox:1.36
          command: ["sh", "-c", "until wget -qO- http://ollama:11434/api/tags >/dev/null; do echo waiting; sleep 3; done"]
          resources:
            requests: {cpu: 10m, memory: 16Mi}
            limits: {cpu: 100m, memory: 32Mi}
      containers:
        - name: pull
          image: curlimages/curl:8.11.1
          envFrom:
            - configMapRef: {name: ai-config}
          command:
            - sh
            - -c
            - >
              curl -sf --max-time 1800 http://ollama:11434/api/pull
              -d "{\"name\":\"${MODEL}\",\"stream\":false}"
          resources:
            requests: {cpu: 10m, memory: 16Mi}
            limits: {cpu: 200m, memory: 64Mi}
