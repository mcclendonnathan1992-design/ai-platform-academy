# NetworkPolicy only bites if your CNI enforces it (kind's default CNI does not; see Module 07).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: ollama-only-from-gateway-and-pull
spec:
  podSelector:
    matchLabels: {app: ollama}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels: {app: gateway}
        - podSelector:
            matchLabels: {app: model-pull}
      ports:
        - port: 11434
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: ai-lab-quota
spec:
  hard:
    requests.cpu: "4"
    requests.memory: 8Gi
    limits.cpu: "8"
    limits.memory: 12Gi
    pods: "20"
