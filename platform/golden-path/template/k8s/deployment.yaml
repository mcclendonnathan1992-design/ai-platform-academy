apiVersion: apps/v1
kind: Deployment
metadata:
  name: __NAME__
  labels: {app: __NAME__}
spec:
  replicas: 2
  selector:
    matchLabels: {app: __NAME__}
  template:
    metadata:
      labels: {app: __NAME__}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: app
          image: __NAME__:dev
          ports:
            - name: http
              containerPort: 8080
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsUser: 10001
            capabilities: {drop: ["ALL"]}
          livenessProbe:
            httpGet: {path: /healthz, port: http}
          readinessProbe:
            httpGet: {path: /healthz, port: http}
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {cpu: 250m, memory: 128Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: __NAME__
spec:
  selector: {app: __NAME__}
  ports:
    - name: http
      port: 80
      targetPort: http
